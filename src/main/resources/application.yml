spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:cmbms}
    username: ${DB_USERNAME:postgres}
    password: "${DB_PASSWORD:br8555ML&}"
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        use_sql_comments: false
  flyway:
    enabled: false
  sql:
    init:
      mode: never
  jackson:
    serialization:
      WRITE_DATES_AS_TIMESTAMPS: false

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

  # Spring Security OAuth2 Resource Server
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8090/realms/buildms
          jwk-set-uri: http://localhost:8090/realms/buildms/protocol/openid-connect/certs

app:
  file:
    upload-dir: ${UPLOAD_DIR:uploads}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  jwt:
    secret: ${JWT_SECRET:buildms-secret-key-for-legacy-jwt-support-minimum-256-bits-required}
    expiration: ${JWT_EXPIRATION:86400000}

server:
  port: ${SERVER_PORT:8080}

# Logging Configuration
logging:
  level:
    org.springframework.security: INFO
    org.springframework.security.oauth2: INFO
    org.springframework.security.web: INFO
    com.org.cmbms: INFO
    org.hibernate.SQL: INFO
    org.hibernate.type.descriptor.sql.BasicBinder: INFO

# Keycloak Configuration
keycloak:
  enabled: true
  realm: buildms
  auth-server-url: http://localhost:8090
  resource: buildms-backend
  credentials:
    secret: ${KEYCLOAK_CLIENT_SECRET:}
  use-resource-role-mappings: false
  bearer-only: true
  ssl-required: none

  # Admin Client Configuration (for user management)
  admin:
    server-url: http://localhost:8090
    realm: buildms
    client-id: buildms-backend
    client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:}
    username: ${KEYCLOAK_ADMIN_USERNAME:}
    password: ${KEYCLOAK_ADMIN_PASSWORD:}
